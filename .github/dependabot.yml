version: 2
updates:
  - package-ecosystem: npm
    directory: "/agent-harness"
    schedule:
      interval: weekly
    groups:
      harness-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
