name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit Harness dependencies when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f agent-harness/package-lock.json ]; then
            cd agent-harness
            npm audit --audit-level=high
          else
            echo "Harness package not created yet; safely skipping."
          fi

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect JavaScript or TypeScript source
        id: source
        shell: bash
        run: |
          if find . -type f \
            \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path './node_modules/*' -print -quit | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No JavaScript or TypeScript source exists yet; CodeQL is deferred."
          fi

      - uses: github/codeql-action/init@v3
        if: steps.source.outputs.enabled == 'true'
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
        if: steps.source.outputs.enabled == 'true'
