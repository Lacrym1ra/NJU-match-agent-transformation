name: Harness Mechanism

on:
  pull_request:
    branches: [main]
    paths:
      - "agent-harness/**"
      - "NJU-Date-basic/backend/**"
      - "NJU-Date-basic/frontend/**"
      - "SPEC.md"
      - "PLAN.md"
      - ".github/workflows/harness-mechanism.yml"
  push:
    branches: [main]
    paths:
      - "agent-harness/**"
      - "NJU-Date-basic/backend/**"
      - "NJU-Date-basic/frontend/**"
      - ".github/workflows/harness-mechanism.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-mechanism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mechanism-demo:
    name: Mock LLM Agent Scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-harness/package-lock.json

      - name: Install
        working-directory: agent-harness
        run: npm ci

      - name: Run deterministic Mock LLM scenario tests
        working-directory: agent-harness
        run: npm test
        env:
          NODE_ENV: test
          HARNESS_NETWORK: deny

      - name: Write action waits for user confirmation
        working-directory: agent-harness
        run: npm run demo:confirmation
        env:
          NODE_ENV: test
          HARNESS_NETWORK: deny

      - name: Business tool feedback changes the next action
        working-directory: agent-harness
        run: npm run demo:feedback
        env:
          NODE_ENV: test
          HARNESS_NETWORK: deny

      - name: Forged user identity is rejected
        working-directory: agent-harness
        run: npm run demo:authorization
        env:
          NODE_ENV: test
          HARNESS_NETWORK: deny

      - name: Upload redacted deterministic traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-agent-mechanism-traces
          path: agent-harness/.agent-traces/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
