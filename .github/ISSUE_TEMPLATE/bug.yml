name: Bug Report
description: 报告一个可复现的 Harness 缺陷
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Trace / 测试证据
      description: 不得粘贴真实凭据。
    validations:
      required: true
