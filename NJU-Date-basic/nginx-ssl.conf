server {
    listen 80;
    server_name njumatch.com www.njumatch.com;
    return 301 https://njumatch.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.njumatch.com;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://njumatch.com$request_uri;
}

# API 限流区域
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# 单 IP 并发连接数限制
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_status 429;

server {
    listen 443 ssl default_server;
    http2 on;
    server_name njumatch.com;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Resolve Docker service names at request time so nginx config checks still
    # pass while backend is down and maintenance mode is being enabled.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:3000;

    # 单 IP 最多 30 个并发连接
    limit_conn conn_per_ip 30;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # 维护模式开关（不依赖后端）
    # 开启：scripts/maintenance-on.sh
    # 关闭：scripts/maintenance-off.sh
    # 原理：宿主机存在 ./ops/maintenance/enabled 时，Nginx 直接返回静态维护页。
    # ============================================================
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
        add_header Retry-After "600" always;
        add_header Cache-Control "no-store" always;
    }

    # 禁止访问 .git 等隐藏目录（任何模式下均生效）
    location ~ /\. {
        return 404;
    }

    # Admin 页面仅限本地访问（通过 SSH 隧道）
    # 公网访问返回定制 404 页面
    location /admin {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker bridge 网段
        deny all;
        error_page 403 =404 /index.html;
        try_files $uri $uri/ /index.html;
    }

    # # Admin API 仅限本地访问（维护模式中禁用）
    location /api/v1/admin/ {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker bridge 网段
        deny all;
        error_page 403 =404 /index.html;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 正常模式 ─────────────────────────────────────────────────
    location /health {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    # WebSocket endpoint for realtime chat
    location /api/v1/realtime {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # 认证接口：更严格限流
    location /api/v1/auth/ {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # ─────────────────────────────────────────────────────────────
}
