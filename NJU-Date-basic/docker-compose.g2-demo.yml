name: nju-date-g2-demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: nju-date-g2-demo-postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=2MB
      -c max_connections=30
      -c wal_buffers=4MB
    environment:
      POSTGRES_DB: ${G2_POSTGRES_DB:-nju_date}
      POSTGRES_USER: ${G2_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${G2_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${G2_DEMO_POSTGRES_PORT:-55432}:5432"
    volumes:
      - g2_demo_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-g2-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${G2_POSTGRES_USER:-postgres} -d ${G2_POSTGRES_DB:-nju_date}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: NJU-Date-basic/backend/Dockerfile
    container_name: nju-date-g2-demo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${G2_POSTGRES_USER:-postgres}:${G2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${G2_POSTGRES_DB:-nju_date}
      DB_SSL: "false"
      DB_POOL_MAX: 5
      FRONTEND_URLS: ${G2_FRONTEND_URLS:-http://localhost:8080,http://127.0.0.1:8080}
      FRONTEND_PUBLIC_URL: ${G2_FRONTEND_PUBLIC_URL:-http://localhost:8080}
      SUPPORT_EMAIL: njumatch@163.com
      TRUST_PROXY: "true"
      JSON_BODY_LIMIT: 256kb
      JWT_SECRET: ${G2_JWT_SECRET:-nju-date-g2-demo-jwt-secret}
      ADMIN_KEY: ${G2_ADMIN_KEY:-nju-date-admin-test}
      HEARTBOX_STUDENT_ID_PEPPER: ${G2_HEARTBOX_STUDENT_ID_PEPPER:-nju-date-g2-demo-student-id-pepper}
      CONTACT_ENCRYPTION_KEY: ${G2_CONTACT_ENCRYPTION_KEY:-nju-date-local-contact-encryption-key}
      CONTACT_BLIND_INDEX_KEY: ${G2_CONTACT_BLIND_INDEX_KEY:-nju-date-local-contact-blind-index-key}
      EMAIL_PROVIDER: smtp
      ALIYUN_DM_ACCESS_KEY_ID: ""
      ALIYUN_DM_ACCESS_KEY_SECRET: ""
      ALIYUN_DM_REGION: cn-hangzhou
      ALIYUN_DM_ACCOUNT_NAME: ""
      ALIYUN_DM_FROM_ALIAS: NJU Date
      DASHSCOPE_API_KEY: ""
      QWEN_MODEL: qwen-plus
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nju-date-g2-demo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${G2_DEMO_FRONTEND_PORT:-8080}:80"

volumes:
  g2_demo_postgres_data:
