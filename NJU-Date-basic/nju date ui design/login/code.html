<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NJU Date 登录</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {

            "primary-fixed": "#ffd6f9",
            "surface-container-low": "#fbf2f1",
            "background": "#fff8f7",
            "on-secondary-container": "#781941",
            "surface": "#fff8f7",
            "surface-container": "#f5eceb",
            "tertiary-container": "#373737",
            "on-error-container": "#93000a",
            "on-error": "#ffffff",
            "outline-variant": "#d4c1cf",

            "error-container": "#ffdad6",
            "surface-tint": "#8f3e91",
            "inverse-on-surface": "#f8efee",

            "inverse-surface": "#342f2f",

            "on-background": "#1e1b1a",
            "on-surface": "#1e1b1a",

            "primary-container": "#611066",
            "on-secondary": "#ffffff",
            "on-primary-fixed": "#37003b",
            "surface-container-high": "#efe6e5",
            "on-tertiary-container": "#a1a0a0",
            "secondary-fixed-dim": "#ffb1c7",

            "on-primary": "#ffffff",

            "on-tertiary-fixed-variant": "#474747"

          fontFamily: {
            "headline": ["Manrope", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "label": ["Inter", "sans-serif"]

          borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },

      },

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Image with Overlay -->
<div class="absolute inset-0 z-0 bg-center bg-cover bg-no-repeat" data-alt="Cinematic, moody, low-light architectural photography of an iconic historic university building (like Nanjing University auditorium) with subtle purple hour lighting, slightly out of focus and blurred to serve as a deep, sophisticated background." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuC85WRiEfg_MJhNWuLKK-aDMcXbDPADSpQX-Rb1slPD2looV_KO0QvzEiW_6Sn0Uzy4jxEFGCp2rL1Ci8Jd2g9HFtZZjGXrleslsa1Uq5ccUbVmfX3fV2uYhYU9cWjc9mDa3XIf9kNsjZprdNU146v5n8ck1E7CXJX8ELbC-AEcmYl6JB0AtNQl-iTj0yO2XayvKcG9IdlUpw8mRWR-efImN0Cxrnb1ZU4CwAxseh16CPzQsyPHdF6dpwBA8CfcxPeFthQ1JDXeDJA");'>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/80 to-surface/40 backdrop-blur-[10px]"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-6 py-12 flex flex-col items-center justify-center min-h-screen">
<!-- Decorative subtle element -->
<div class="w-16 h-1 bg-gradient-to-r from-primary-container to-primary rounded-full mb-12 opacity-80"></div>
<!-- Header Section -->
<header class="text-center w-full mb-10 space-y-4">
<h1 class="font-headline text-5xl font-extrabold tracking-[-0.02em] text-on-surface leading-tight">
        在南大，<br/>遇见同频的灵魂
      </h1>
<p class="font-body text-lg text-on-surface-variant leading-relaxed">
        The Digital Curator for NJU Alumni
      </p>
</header>
<!-- Login Form Area (Glassmorphism card) -->
<div class="w-full bg-surface/80 backdrop-blur-[20px] p-8 rounded-xl flex flex-col gap-6 shadow-[0_12px_32px_rgba(66,0,71,0.06)] border border-outline-variant/15">
<!-- Input Group: Account -->
<label class="flex flex-col w-full group">
<span class="font-label uppercase tracking-widest text-xs text-on-surface-variant mb-2">南京大学统一身份认证 / 邮箱</span>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="form-input w-full bg-surface-container-high text-on-surface border-none focus:ring-0 rounded-lg h-14 pl-12 pr-4 placeholder:text-outline/50 transition-all focus:bg-surface-container-highest focus:shadow-[0_0_0_2px_rgba(66,0,71,0.2)]" placeholder="请输入账号" type="text"/>
</div>
</label>
<!-- Input Group: Password -->
<label class="flex flex-col w-full group">
<span class="font-label uppercase tracking-widest text-xs text-on-surface-variant mb-2">密码</span>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="form-input w-full bg-surface-container-high text-on-surface border-none focus:ring-0 rounded-lg h-14 pl-12 pr-4 placeholder:text-outline/50 transition-all focus:bg-surface-container-highest focus:shadow-[0_0_0_2px_rgba(66,0,71,0.2)]" placeholder="请输入密码" type="password"/>
<button class="absolute right-4 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</label>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full">
<a class="font-body text-sm font-medium text-primary hover:text-primary-container transition-colors" href="#">忘记密码？</a>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 mt-4 bg-gradient-to-br from-primary-container to-primary text-on-primary font-headline font-bold text-lg rounded-xl flex items-center justify-center gap-2 hover:opacity-95 transition-opacity shadow-[0_8px_24px_rgba(66,0,71,0.2)]">
        登录 / 验证身份
        <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<!-- Alternative Action -->
<div class="w-full text-center mt-2">
<p class="font-body text-sm text-on-surface-variant">
          新校友？ 
          <a class="font-bold text-primary hover:text-primary-container transition-colors ml-1" href="#">立即注册体验</a>
</p>
</div>
</div>
</main>
</body></html>
