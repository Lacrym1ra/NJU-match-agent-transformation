<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NJU Match - 策展浪漫</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-sans: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', ui-serif, Georgia, serif;
    }

    body {
      min-height: 100vh;
      background-color: #FCFBF8;
      color: #2C2825;
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(transparent 47px, rgba(234,231,225,0.6) 48px);
      background-size: 100% 48px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 24rem; /* max-w-sm */
      width: 100%;
    }

    .brand {
      font-family: var(--font-sans);
      font-size: 0.75rem; /* text-xs */
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #8B7355;
      margin-bottom: 1.5rem; /* mb-6 */
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 4.5rem;   /* text-7xl */
      line-height: 1;
      font-weight: 300;    /* font-light */
      color: #420047;
      letter-spacing: 0.1em; /* tracking-widest */
      margin-bottom: 1rem;
    }

    @media (min-width: 768px) {
      h1 { font-size: 6rem; } /* md:text-8xl */
    }

    .divider {
      width: 3rem;
      height: 1px;
      background: #D4C9B8;
      margin: 0 auto 1.5rem;
    }

    .title {
      font-family: var(--font-serif);
      font-size: 1.125rem; /* text-lg */
      letter-spacing: 0.1em; /* tracking-widest */
      color: #2C2825;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.875rem; /* text-sm */
      color: #8B7355;
      letter-spacing: 0.025em; /* tracking-wide */
      line-height: 1.625;  /* leading-relaxed */
      margin-bottom: 2.5rem; /* mb-10 */
    }

    a {
      font-family: var(--font-sans);
      display: inline-block;
      font-size: 0.875rem; /* text-sm */
      letter-spacing: 0.2em; /* tracking-[0.2em] */
      color: #420047;
      border: 1px solid #420047;
      padding: 0.75rem 2rem; /* px-8 py-3 */
      text-decoration: none;
      transition: background-color 0.3s, color 0.3s;
    }

    a:hover {
      background-color: #420047;
      color: #FCFBF8;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="brand">NJU Match</p>
    <h1>404</h1>
    <div class="divider"></div>
    <p class="title">此页不存在</p>
    <p class="subtitle">你所寻觅的角落，尚未在这里留下痕迹</p>
    <a href="/">返回主页</a>
  </div>
</body>
</html>
