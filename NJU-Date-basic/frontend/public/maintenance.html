<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NJU Match · 平台优化中</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'Material Symbols Outlined';
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url('/fonts/material-symbols-outlined-subset-v1.woff2') format('woff2');
    }

    body {
      min-height: 100vh;
      background-color: #FCFBF8;
      font-family: Georgia, "Times New Roman", serif;
      color: #2C2825;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* 背景线条 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(transparent 47px, rgba(234,231,225,0.6) 48px);
      background-size: 100% 48px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    /* 装饰圆圈 */
    .avatar-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1px solid #8B7355;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2.5rem;
      position: relative;
      background: #FCFBF8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1px dashed rgba(139,115,85,0.4);
      animation: spin 60s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .avatar-icon {
      font-family: 'Material Symbols Outlined';
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      color: #8B7355;
      font-feature-settings: 'liga';
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'GRAD' 0, 'opsz' 24;
    }

    .brand {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #8B7355;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      color: #2C2825;
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: rgba(139,115,85,0.3);
      margin: 1.5rem auto;
    }

    .subtitle {
      font-size: 0.95rem;
      line-height: 1.9;
      color: #8B7355;
      letter-spacing: 0.05em;
      font-style: italic;
    }

    .quote {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      color: #B5AFA6;
      line-height: 1.8;
    }

    .quote em {
      font-style: normal;
      color: #8B7355;
    }

    /* 底部小字 */
    .footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: #B5AFA6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar-ring">
      <span class="avatar-icon">build</span>
    </div>

    <p class="brand">NJU Match</p>

    <h1>平台优化中</h1>

    <div class="divider"></div>

    <p class="subtitle">
      我们正在为你打磨更好的体验<br/>
      请稍候片刻，很快便会归来
    </p>

    <p class="quote">
      「 斯人若彩虹，遇上方知有 」<br/>
      <em>— 敬请期待 —</em>
    </p>
  </div>

  <p class="footer">Nanjing University Match &nbsp;·&nbsp; njumatch.com</p>
</body>
</html>
