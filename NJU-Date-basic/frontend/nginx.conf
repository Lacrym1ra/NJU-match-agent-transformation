limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_status 429;

# Preserve HTTPS information supplied by the host gateway. When the container
# is accessed directly for local testing, fall back to its own HTTP scheme.
map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Trust forwarding headers only from the host/Docker gateway so rate
    # limits and local-only admin rules still operate on the real client IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_conn conn_per_ip 30;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    root /usr/share/nginx/html;
    index index.html;

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
        add_header Retry-After "600" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. {
        return 404;
    }

    location /admin {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        error_page 403 =404 /index.html;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/v1/admin/ {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        error_page 403 =404 /index.html;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:3000;

    # Health check proxy to backend
    location /health {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # WebSocket endpoint for realtime chat
    location /api/v1/realtime {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /api/v1/auth/ {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # API requests proxy to backend (^~ takes priority over regex static asset rule)
    location ^~ /api/ {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # SPA fallback - all other routes serve index.html
    location / {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        if (-f /etc/nginx/maintenance/enabled) { return 503; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
