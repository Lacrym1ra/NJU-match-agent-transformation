services:
  backend:
    environment:
      # The host path is supplied by systemd for this service only. The
      # application reads the mounted file and never exposes its value.
      LLM_API_KEY: ""
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
    volumes:
      - ${CREDENTIALS_DIRECTORY:?Run through nju-match.service}/llm_api_key:/run/secrets/llm_api_key:ro
    security_opt:
      - no-new-privileges:true
